name: Deploy SOP-Portal to Production Environment

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SERVER_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            ubuntu@${{ secrets.PROD_SERVER_HOST }} "
            /snap/bin/aws s3 cp s3://sop-portal-resource-files/prod/sop-portal/deploy-sop-portal-prod.sh /tmp/deploy-sop-portal-prod.sh && 
            chmod +x /tmp/deploy-sop-portal-prod.sh && 
            /tmp/deploy-sop-portal-prod.sh"